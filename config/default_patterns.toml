# RedactAnon Default Built-in Patterns
# These patterns are loaded automatically unless --no-defaults is specified

[email]
pattern = '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
type = "email"
description = "Email addresses"

[ipv4]
pattern = '\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b'
type = "ip_address"
description = "IPv4 addresses"

[ipv6]
pattern = '\b(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}\b'
type = "ip_address"
description = "IPv6 addresses (basic format)"

[phone_us]
pattern = '\b(?:\+?1[-.\s]?)?\(?[0-9]{3}\)?[-.\s]?[0-9]{3}[-.\s]?[0-9]{4}\b'
type = "phone"
description = "US phone numbers"

[ssn]
pattern = '\b[0-9]{3}[-\s]?[0-9]{2}[-\s]?[0-9]{4}\b'
type = "ssn"
description = "US Social Security Numbers"

[credit_card]
pattern = '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|3[0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b'
type = "credit_card"
description = "Credit card numbers (Visa, MasterCard, American Express, Discover)"
